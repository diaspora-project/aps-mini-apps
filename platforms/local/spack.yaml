# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - tekapp
  - mofka+python
  view: true
  concretizer:
    unify: true
  repos:
    diaspora:
      git: https://github.com/diaspora-project/diaspora-spack-packages.git
      destination: $env/repos/diaspora
      # if you want to use a specific commit, uncomment and change the following line
      # commit: <commit-hash>
    mochi:
      git: https://github.com/mochi-hpc/mochi-spack-packages.git
      destination: $env/repos/mochi
      # if you want to use a specific commit, uncomment and change the following line
      # commit: <commit-hash>
    builtin:
      git: https://github.com/spack/spack-packages.git
      destination: $env/repos/builtin
      # if you want to use a specific commit, uncomment and change the following line
      # commit: <commit-hash>
  packages:
    mpi:
      require: "mpich"
    diaspora-stream-api:
      require: "@0.5.7:"
    mercury:
      require: "~boostsys ~checksum"
    libfabric:
      require: "fabrics=tcp,rxm"
    mochi-yokan:
      require: "+rocksdb"
