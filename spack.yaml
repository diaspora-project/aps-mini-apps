# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - mofka@0.8.3+python
  - diaspora-stream-api@0.5.4
  - py-mochi-margo
  - py-numpy
  - py-scipy
  - swig # rm
  - py-tomopy@1.11.0
  - libzmq # rm
  - py-pyzmq # rm
  - py-matplotlib
  - py-dxchange
  - py-pip
  - hdf5+mpi
  - py-h5py
  - flatbuffers
  - py-flatbuffers
#  - py-tensorflow # it takes up to 8h to install :) comment if not needed
  view: true
  concretizer:
    unify: true
  packages:
    mofka:
      require:
      - "@0.8.3:"
      - "+python"
    diaspora-stream-api:
      require:
      - "@0.5.4:"
